name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Static security analysis
        run: |
          pip install bandit
          bandit -r app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    env:
      UPENFLOW_FIRST_ADMIN_NAME: E2E Admin
      UPENFLOW_FIRST_ADMIN_EMAIL: e2e-admin@example.com
      UPENFLOW_FIRST_ADMIN_PASSWORD: E2E-Test-Password-2026!
      UPENFLOW_OTP_PEPPER: e2e-otp-pepper
      UPENFLOW_SERVICE_A_API_KEY: e2e-service-a-key
      UPENFLOW_SERVICE_A_HMAC_SECRET: e2e-service-a-hmac-secret
      UPENFLOW_SERVICE_B_REPLY_API_KEY: e2e-service-b-reply-key
      POSTGRES_PASSWORD: e2e-postgres-password
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_ADMIN_PASSWORD: E2E-Test-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the web and API containers to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null && curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/auth/me | grep -q 401; then
              echo "Stack is up"; exit 0
            fi
            sleep 2
          done
          echo "Stack did not become ready in time"; docker compose logs; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - if: always()
        run: docker compose down -v
